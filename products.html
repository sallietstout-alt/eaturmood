<style>
:root{
  --cream:#F7F0E2; --night:#120A07; --ink:#EFE4D6; --dim:rgba(239,228,214,.58);
  --gold:#C4974A; --paper:#EDE3D2; --margin:clamp(20px,6vw,110px);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--ground,#2F1B10);color:var(--ink);font-family:"Jost",system-ui,sans-serif;
  min-height:100svh;overflow-x:hidden}
img,video{display:block;max-width:100%}

.top{position:fixed;top:0;left:0;right:0;z-index:40;display:flex;
  justify-content:space-between;align-items:center;padding:18px var(--margin);
  font-family:"Jost",system-ui,sans-serif;font-size:10.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--chrome,rgba(60,40,30,.55));transition:color 1800ms ease}
.top a{color:inherit;text-decoration:none}
.top a:hover{color:var(--gold)}

/* ---------- the cart rolls into night ---------- */
.trip{position:fixed;inset:0;z-index:10;display:grid;place-items:center;
  background:var(--ground,#2F1B10);
  transition:opacity 1600ms ease}
.trip.gone{opacity:0;pointer-events:none}
.trip video,.trip .still,.trip .hold{width:100%;height:100%;object-fit:contain}
.trip .still,.trip .hold{position:absolute;inset:0;opacity:0;transition:opacity 1400ms ease}
.trip .still.on,.trip .hold.on{opacity:1}
.trip.fallback video{display:none}

.title{position:fixed;inset:0;z-index:12;display:grid;place-items:center;
  text-align:center;padding:0 var(--margin);pointer-events:none;
  opacity:0;transition:opacity 1500ms ease}
.title.on{opacity:1}
.title .eyebrow{font-family:"Jost",system-ui,sans-serif;font-size:11px;letter-spacing:.32em;
  text-transform:uppercase;color:var(--gold);margin-bottom:1em}
.title h1{font-style:italic;font-weight:500;font-size:clamp(40px,8.5vw,110px);line-height:.95;
  text-shadow:0 4px 44px rgba(0,0,0,.8)}

/* ---------- the room ---------- */
.room{position:fixed;inset:0;z-index:2;opacity:0;transition:opacity 2400ms ease}
.room.on{opacity:1}
.room img{width:100%;height:100%;object-fit:cover}
.room::after{content:"";position:absolute;inset:0;
  background:radial-gradient(115% 82% at 50% 44%,rgba(8,4,3,.4) 28%,rgba(8,4,3,.84) 74%,rgba(8,4,3,.96) 100%)}

/* ---------- the book ---------- */
.stagewrap{position:relative;z-index:20;min-height:100svh;display:grid;place-items:center;
  gap:clamp(18px,3vh,32px);padding:clamp(72px,11vh,130px) var(--margin) clamp(46px,7vh,90px);
  opacity:0;transform:translateY(22px);pointer-events:none;
  transition:opacity 1600ms ease,transform 1700ms cubic-bezier(.22,1,.36,1)}
.stagewrap.on{opacity:1;transform:none;pointer-events:auto}

.stage{perspective:2400px;perspective-origin:50% 42%;position:relative;
  width:min(78vw, calc((100svh - 250px) * 0.8), 520px);aspect-ratio:4/5}
.book{position:absolute;inset:0;transform-style:preserve-3d}
.leaf{position:absolute;inset:0;transform-style:preserve-3d;transform-origin:left center;
  transition:transform 1.05s cubic-bezier(.5,.06,.28,1);
  box-shadow:0 34px 80px rgba(0,0,0,.7)}
.leaf.turned{transform:rotateY(-176deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;overflow:hidden;
  background:var(--paper);color:#241812}
.face.back{transform:rotateY(180deg)}
.face img{width:100%;height:100%;object-fit:cover}
.face::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(90deg,rgba(0,0,0,.32) 0%,rgba(0,0,0,.06) 9%,rgba(0,0,0,0) 22%)}
.face.back::after{background:linear-gradient(270deg,rgba(0,0,0,.28) 0%,rgba(0,0,0,.05) 9%,rgba(0,0,0,0) 22%)}

.face.said{padding:clamp(26px,9%,58px);display:flex;flex-direction:column;justify-content:center}
.face.said .eyebrow{font-family:"Jost",system-ui,sans-serif;font-size:10px;letter-spacing:.22em;
  text-transform:uppercase;color:#7A6E58;margin-bottom:1.5em}
.face.said p{font-style:italic;font-size:clamp(15px,2.9vw,23px);line-height:1.5;margin-bottom:.9em}
.face.said .sign{margin-top:auto;font-family:"Jost",system-ui,sans-serif;font-size:9.5px;
  letter-spacing:.18em;text-transform:uppercase;color:#7A6E58}

.turnzone{position:absolute;top:0;bottom:0;width:50%;z-index:25;cursor:pointer;background:none;border:0}
.turnzone.next{right:0}.turnzone.prev{left:0}

.controls{display:flex;align-items:center;gap:1.4em;
  font-family:"Jost",system-ui,sans-serif;font-size:10.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--dim)}
.controls button{font:inherit;letter-spacing:inherit;text-transform:inherit;background:none;
  border:0;color:var(--ink);cursor:pointer;border-bottom:1px solid rgba(196,151,74,.45);padding-bottom:4px}
.controls button:hover:not(:disabled){color:var(--gold);border-bottom-color:var(--gold)}
.controls button:disabled{opacity:.3;cursor:default;border-bottom-color:transparent}

.foot{position:relative;z-index:20;display:flex;justify-content:space-between;gap:1.2em;
  flex-wrap:wrap;padding:24px var(--margin) 38px;
  font-family:"Jost",system-ui,sans-serif;font-size:10.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--dim);border-top:1px solid rgba(239,228,214,.1);
  opacity:0;transition:opacity 1500ms ease}
.foot.on{opacity:1}
.foot a{color:inherit;text-decoration:none}
.foot a:hover{color:var(--gold)}

@media (prefers-reduced-motion:reduce){*{transition-duration:1ms!important}}

/* display type matches the portfolio: Bodoni Moda */
h1,h2,h3,.hero h1,.title h1,.headline,.face.said p,.note .place,.intro h2,.course h2,.card h3{font-family:"Bodoni Moda",serif}

/* ---- the cravings cart, told in four frames ---- */
.trip video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.trip.playing .frame{display:none}
.trip .frame{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;
  opacity:0;transform:scale(1.012);
  transition:opacity 900ms ease,transform 2600ms cubic-bezier(.22,1,.36,1)}
.trip .frame.on{opacity:1;transform:scale(1)}
@media (prefers-reduced-motion:reduce){.trip .frame{transition-duration:1ms}}
</style>

<script>
/* ---------- arrival ----------
   The cart is a real piece of footage now: three interpolated clips joined into
   one, so the ground colour ramps continuously rather than cutting between four
   flat states. The page reads that ramp off a table sampled from the film itself
   and follows it frame by frame, which keeps the letterbox the same colour as the
   backdrop at every moment. The header flips light or dark on the ramp's own
   luminance. If the video will not autoplay — iOS in low power, mostly — the four
   source stills carry the sequence instead. */
var RAMP = [
  [0.00,  49, 28, 16], [0.60,  63, 44, 30], [1.00, 102, 91, 69],
  [1.46, 147,143,106], [2.33, 196,185,107], [2.96, 141,140, 90],
  [3.50, 103, 77, 68], [3.75,  90, 49, 60], [5.62,  83, 42, 54],
  [6.00,  67, 37, 41], [6.33,  52, 29, 23], [7.05,  49, 28, 16]
];

var trip = document.getElementById('trip');
var cart = document.getElementById('cart');
function on(id){ document.getElementById(id).classList.add('on'); }
function off(id){ document.getElementById(id).classList.remove('on'); }

function groundAt(t){
  if (t <= RAMP[0][0]) return RAMP[0].slice(1);
  for (var i = 1; i < RAMP.length; i++) {
    if (t <= RAMP[i][0]) {
      var a = RAMP[i-1], b = RAMP[i];
      var f = (t - a[0]) / (b[0] - a[0]);
      return [1,2,3].map(function(k){ return Math.round(a[k] + (b[k] - a[k]) * f); });
    }
  }
  return RAMP[RAMP.length-1].slice(1);
}

function tintAt(t){
  var c = groundAt(t);
  document.body.style.setProperty('--ground', 'rgb(' + c.join(',') + ')');
  /* the olive stretch is bright enough that cream type disappears on it */
  var lum = (c[0]*0.299 + c[1]*0.587 + c[2]*0.114);
  document.body.style.setProperty('--chrome',
    lum > 120 ? 'rgba(60,48,28,.72)' : 'rgba(246,240,228,.62)');
}
tintAt(0);

/* the room and the book arrive on their own clock, whichever way the cart plays */
setTimeout(function(){ on('room'); }, 6100);
setTimeout(function(){ trip.classList.add('gone'); }, 7000);
setTimeout(function(){ on('stagewrap'); on('foot'); }, 7900);

/* timeupdate only fires a few times a second, which reads as steps on a slow
   ramp — follow the clock on every frame instead while the film is running */
var following = false;
function follow(){
  if (cart.paused || cart.ended) { following = false; return; }
  tintAt(cart.currentTime);
  requestAnimationFrame(follow);
}

var settled = false;
function useVideo(){
  if (!following) { following = true; requestAnimationFrame(follow); }
  if (settled) return; settled = true;
  trip.classList.add('playing');
}
function useStills(){
  if (settled) return; settled = true;
  [1,2,3].forEach(function(i){
    var im = document.getElementById('f' + i);
    if (im && im.dataset.src) im.src = im.dataset.src;
  });
  var STOPS = [0, 2.39, 4.96, 6.60];
  var frame = 0;
  var beat = setInterval(function(){
    var next = frame + 1;
    if (next >= STOPS.length) { clearInterval(beat); return; }
    tintAt(STOPS[next]);
    on('f' + next); off('f' + frame);
    frame = next;
  }, 1700);
}

cart.addEventListener('playing', useVideo);
cart.addEventListener('error', useStills);
var played = cart.play();
if (played && played.catch) played.catch(useStills);
setTimeout(function(){ if (cart.paused || cart.currentTime === 0) useStills(); }, 1200);

/* ---------- the book ---------- */
const PAGES = ["278446c7fbcb.webp","005055125500.webp","679988a778a8.webp","e600a0b33f32.webp","8412d13a84c3.webp","7e4ef6323bb0.webp","41f1bc4ed718.webp","860cf32dc18d.webp","a3a26e7c00f4.webp","6ec46b9db551.webp"];

/* the loaf opens the book and carries its own description; the rest of the
   pages only load once someone actually starts turning */
const ALTS = {"278446c7fbcb.webp":
  "A scored loaf on a paper doily on a silver tray, spelled out in pasta letters: you have great taste"};
const book = document.getElementById('book');
const leafEls = [];
function addLeaf(inner){
  const leaf = document.createElement('div');
  leaf.className = 'leaf';
  leaf.innerHTML = inner;
  book.appendChild(leaf);
  leafEls.push(leaf);
}

PAGES.forEach((src, i) => addLeaf(
  '<div class="face front"><img src="' + src + '" alt="' +
    (ALTS[src] || 'A curated set of pieces') + '"' +
    (i === 0 ? '' : ' loading="lazy"') + ' decoding="async"></div>' +
  '<div class="face back"></div>'));

const total = leafEls.length;
let at = 0;
function paint(){
  leafEls.forEach((el, i) => {
    const turned = i < at;
    el.classList.toggle('turned', turned);
    el.style.zIndex = turned ? i : (total - i);
  });
  document.getElementById('counter').textContent =
    at === 0 ? 'Open' : (at >= total ? 'The end' : at + ' of ' + total);
  document.getElementById('bprev').disabled = at === 0;
  document.getElementById('bnext').disabled = at >= total;
}
const fwd  = () => { if (at < total) { at++; paint(); } };
const back = () => { if (at > 0)     { at--; paint(); } };
document.getElementById('next').addEventListener('click', fwd);
document.getElementById('prev').addEventListener('click', back);
document.getElementById('bnext').addEventListener('click', fwd);
document.getElementById('bprev').addEventListener('click', back);
addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') fwd();
  if (e.key === 'ArrowLeft')  back();
});
paint();
</script>
