<style>
:root{--cream:#F6F0E4;--brown:#2D1C12;--gold:#C1A35F;--plum:#4D2A36}
*{box-sizing:border-box}
html,body{margin:0;background:var(--brown)}
body{color:var(--cream);font-family:'Jost',system-ui,sans-serif;font-weight:300;line-height:1.62}
.wrap{max-width:1000px;margin:0 auto;padding:30px 22px 80px}
.back{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:rgba(246,240,228,.5);text-decoration:none}
.back:hover{color:var(--gold)}


h2{font-family:'Jost';font-weight:400;font-size:11px;letter-spacing:.26em;text-transform:uppercase;
 color:var(--gold);margin:60px 0 20px;padding-bottom:9px;border-bottom:1px solid rgba(193,163,95,.4)}


.reels{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:26px}
.reel{margin:0;position:relative}
.reel video{width:100%;aspect-ratio:9/16;object-fit:cover;display:block;background:#241611;cursor:pointer}
.play{position:absolute;left:50%;top:32%;transform:translate(-50%,-50%);width:46px;height:46px;border-radius:50%;
 border:1px solid rgba(246,240,228,.75);background:rgba(45,28,18,.35);cursor:pointer;transition:opacity .4s}
.play::after{content:"";position:absolute;left:53%;top:50%;transform:translate(-50%,-50%);
 border-left:11px solid var(--cream);border-top:7px solid transparent;border-bottom:7px solid transparent}
.reel.playing .play{opacity:0;pointer-events:none}
.rt{font-family:'Bodoni Moda',serif;font-size:17px;margin:11px 0 0}
.rc{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin:3px 0 0}
.rd{font-size:14px;margin:5px 0 0;color:rgba(246,240,228,.68)}



ul{margin:0;padding-left:18px} li{font-size:16px;margin:0 0 9px;color:rgba(246,240,228,.84)}

.cta{display:inline-block;margin:26px 0 0;border-bottom:1px solid rgba(193,163,95,.6);padding-bottom:4px;
 font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--cream);text-decoration:none}
.cta:hover{border-bottom-color:var(--cream)}
.foot{margin-top:56px;border-top:1px solid rgba(246,240,228,.16);padding-top:22px;font-size:14px;color:rgba(246,240,228,.7)}
.foot a{color:inherit}
@media(max-width:760px){.film,.case,}
@media(prefers-reduced-motion:reduce){*{transition:none}}

.pagehead{padding:52px 0 34px;border-bottom:1px solid rgba(246,240,228,.16);margin:0 0 10px}
.pagehead h1{font-family:'Bodoni Moda',serif;font-weight:400;font-size:clamp(28px,5.2vw,50px);
 line-height:1.08;margin:0;max-width:20ch;color:var(--cream)}
.pagehead h1 em{font-style:italic}
</style>

<script>
document.querySelectorAll('.reel').forEach(r => {
  const v = r.querySelector('video'), b = r.querySelector('.play');
  const toggle = () => {
    if (v.paused) {
      document.querySelectorAll('.reel video').forEach(o => { if (o!==v) { o.pause(); o.closest('.reel').classList.remove('playing'); } });
      v.play(); r.classList.add('playing');
    } else { v.pause(); r.classList.remove('playing'); }
  };
  b.addEventListener('click', toggle); v.addEventListener('click', toggle);
});
