<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400;1,6..96,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>:root{
  --cream:#F6F0E4; --plum:#3D1A2C; --red:#B83226; --gold:#C4974A;
  --brown:#2C1A0E; --ground:#2F1B10;
  --margin:clamp(22px,5.2vw,86px);
  --lift:1100ms;
  --chrome:clamp(140px,20vh,240px);
  --bleed:100%;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--ground);color:var(--cream);
  font-family:"Jost",system-ui,sans-serif;
  min-height:100dvh;overflow-x:hidden;
  display:grid;grid-template-rows:auto 1fr auto;
  padding:clamp(18px,3vh,40px) 0 clamp(18px,3vh,40px);
}

.head{
  padding-left:var(--margin);font-style:italic;font-weight:500;color:var(--cream);
  font-size:clamp(30px,5.4vw,74px);line-height:1.06;letter-spacing:-.005em;
  transition:font-size 900ms cubic-bezier(.22,1,.36,1),
             transform 900ms cubic-bezier(.22,1,.36,1),opacity 700ms ease;
  transform:translateY(14vh);
}
body.open .head{font-size:clamp(19px,2.5vw,38px);transform:translateY(0)}

.stagewrap{display:grid;place-items:center;min-height:0;overflow:hidden}
.stage{
  position:relative;aspect-ratio:16/9;isolation:isolate;
  width:min(var(--bleed), calc((100dvh - var(--chrome)) * 1.7778));
  transform:scale(.985);
  transition:transform 1200ms cubic-bezier(.22,1,.36,1);
}
body.open .stage{transform:scale(1)}
@media (max-aspect-ratio:1/1){ :root{--bleed:150%} }

.scene{position:absolute;inset:0;opacity:0;transform:scale(.972);
  transition:opacity 900ms ease 180ms,transform 1200ms cubic-bezier(.22,1,.36,1) 180ms}
body.open .scene{opacity:1;transform:scale(1)}

/* the tray is one photograph now — it breathes as a whole piece */
.trayfloat{position:absolute;inset:0;animation:sway 24s ease-in-out infinite}
@keyframes sway{0%,100%{transform:translate3d(0,0,0)}50%{transform:translate3d(0,-7px,0)}}
.tray{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}

/* ---------- what you can click ----------
   The objects are printed into the photograph, so nothing can actually move.
   Instead the light does: a warm spot blooms over whatever you are pointing at,
   and a soft shadow gathers under it, as if it had been picked out of the tray. */
.hit{position:absolute;display:block;text-decoration:none;border-radius:48%;
  -webkit-tap-highlight-color:transparent;cursor:pointer}

/* the light */
.hit::before{content:"";position:absolute;inset:-6%;border-radius:inherit;
  background:radial-gradient(closest-side,
    rgba(255,238,206,.30) 0%,rgba(255,230,190,.14) 46%,rgba(255,230,190,0) 76%);
  mix-blend-mode:screen;opacity:0;transform:scale(.94);
  transition:opacity 520ms ease,transform 760ms cubic-bezier(.22,1,.36,1);
  pointer-events:none}

/* the shadow it casts back onto the silver */
.hit::after{content:"";position:absolute;left:8%;right:8%;bottom:-3%;height:26%;
  border-radius:50%;
  background:radial-gradient(closest-side,rgba(28,14,6,.34),rgba(28,14,6,0) 74%);
  opacity:0;transform:scale(.9);
  transition:opacity 520ms ease,transform 760ms cubic-bezier(.22,1,.36,1);
  pointer-events:none}

.hit:hover::before,.hit:focus-visible::before{opacity:1;transform:scale(1)}
.hit:hover::after, .hit:focus-visible::after {opacity:1;transform:scale(1)}
.hit:focus-visible{outline:2px solid var(--gold);outline-offset:6px}

/* ---------- the coupe keeps its champagne ---------- */
.bubbles{position:absolute;border-radius:50%;overflow:hidden;pointer-events:none;
  z-index:2;opacity:.62;transition:opacity 600ms ease}
#interiors:hover ~ .bubbles,#interiors:focus-visible ~ .bubbles{opacity:1}
.bubbles i{position:absolute;top:100%;border-radius:50%;
  background:radial-gradient(circle at 34% 30%,#fff,rgba(255,250,232,.92) 52%,rgba(255,248,222,.35));
  box-shadow:0 0 2px rgba(255,252,240,.55);
  animation:rise var(--br) linear infinite var(--bd)}
@keyframes rise{
  0%{top:100%;transform:scale(.5);opacity:0}
  14%{opacity:.95}
  82%{opacity:.7}
  100%{top:-10%;transform:scale(1.18);opacity:0}
}

/* only the eye has no label printed on it, so only the eye names itself */
.chip{position:absolute;left:50%;bottom:calc(100% + 8px);translate:-50% 8px;
  background:var(--plum);color:var(--cream);font-style:italic;
  font-size:clamp(11px,1.05vw,16px);padding:.34em .8em;border-radius:2px;
  white-space:nowrap;opacity:0;pointer-events:none;
  transition:opacity 240ms ease,translate 320ms cubic-bezier(.22,1,.36,1)}
.hit:hover .chip,.hit:focus-visible .chip{opacity:1;translate:-50% 0}

/* ---------- cloche ---------- */
.cover{position:absolute;inset:0;display:grid;place-items:center;z-index:5}
.cloche{width:64%;cursor:pointer;transform-origin:50% 92%;
  filter:drop-shadow(0 26px 40px rgba(0,0,0,.42));
  transition:transform var(--lift) cubic-bezier(.32,.9,.28,1),
             opacity calc(var(--lift)*.62) ease calc(var(--lift)*.38)}
body.open .cloche{transform:translateY(-128%) scale(1.1);opacity:0}
body.open .cover{pointer-events:none}

/* ---------- footer ---------- */
.foot{padding-left:var(--margin);display:flex;align-items:baseline;gap:1.4em;
  opacity:0;transition:opacity 800ms ease 500ms}
body.open .foot{opacity:1}
.foot a{font-style:italic;font-size:clamp(17px,1.9vw,30px);color:var(--gold);text-decoration:none}
.foot a:hover{color:var(--red)}
.foot .hint{font-family:"Jost",system-ui,sans-serif;font-size:11px;letter-spacing:.1em;
  color:rgba(246,240,228,.42)}
@media (hover:none){ .chip{opacity:1;translate:-50% 0;font-size:10px} .foot .hint{display:none} }

h1,h2,h3{font-family:"Bodoni Moda",serif}

@media (max-width:820px){ .trayfloat{animation:none!important} .bubbles{opacity:.75} }
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:1ms!important}}
</style>

<h1 class="head">What are you craving?</h1>

<div class="stagewrap">
  <div class="stage" id="stage">
    <div class="scene">
      <div class="trayfloat">
        <img class="tray" src="df35504f2fb5.webp" alt="A silver tray set with an amber coupe marked Interiors, a block of butter embossed Services, a sourdough loaf scored Cravings, and a stack of photographs marked About Me" decoding="async" fetchpriority="high">
      </div>

      <a class="hit" id="interiors" href="styling.html" aria-label="Interiors"
         style="left:27%;top:8%;width:15.5%;height:33%"></a>

      <span class="bubbles" id="bub" style="left:28.4%;top:9.2%;width:12%;height:15.6%"></span>

      <a class="hit" href="eaturmood-services_3.html" aria-label="Services"
         style="left:41%;top:18.5%;width:20.5%;height:19.5%"></a>

      <a class="hit" href="secret-menu.html" aria-label="Cravings"
         style="left:29.5%;top:39.5%;width:27.5%;height:36%"></a>

      <a class="hit" href="about.html" aria-label="About Me"
         style="left:58%;top:32%;width:22%;height:40%"></a>

      <a class="hit" id="eye" href="big-feelings.html" aria-label="Big Feelings"
         style="left:56.6%;top:55.8%;width:5.8%;height:10.6%;z-index:3;border-radius:14%">
        <span class="chip">Big Feelings</span>
      </a>
    </div>

    <div class="cover"><img class="cloche" id="cloche" src="a5986498064b.webp" alt="Silver cloche — click to lift" decoding="async"></div>
  </div>
</div>

<div class="foot">
  <a href="mailto:hello@eaturmood.com">hello@eaturmood.com</a>
  <span class="hint">hover the tray</span>
</div>

<script>
/* champagne in the coupe */
const bub=document.getElementById('bub');
for(let i=0;i<22;i++){
  const sp=document.createElement('i');
  const sz=2.4+Math.random()*3.6;
  sp.style.width=sp.style.height=sz+'px';
  sp.style.left=(10+Math.random()*80)+'%';
  sp.style.setProperty('--br',(2.0+Math.random()*2.6)+'s');
  sp.style.setProperty('--bd',(-Math.random()*4)+'s');
  bub.appendChild(sp);
}

const b=document.body;
let t=setTimeout(()=>b.classList.add('open'), 800);
const open_=()=>{clearTimeout(t); b.classList.add('open')};
document.getElementById('cloche').addEventListener('click',open_);
addEventListener('wheel',open_,{once:true,passive:true});
addEventListener('touchmove',open_,{once:true,passive:true});



</script>
