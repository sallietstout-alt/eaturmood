<style>
:root{
  --cream:#F6F0E4; --plum:#3D1A2C; --red:#B83226; --gold:#C4974A; --brown:#2C1A0E;
  --margin:clamp(22px,5.2vw,86px);
  --lift:1100ms; --hold:800ms;
  --chrome:clamp(140px,20vh,240px);   /* headline + footer + padding */
  --bleed:100%;                       /* landscape: the oval fits, so no bleed */
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--cream);color:var(--plum);
  font-family:"Jost",system-ui,sans-serif;
  min-height:100dvh;overflow-x:hidden;
  display:grid;grid-template-rows:auto 1fr auto;
  padding:clamp(18px,3vh,40px) 0 clamp(18px,3vh,40px);
}

/* headline shrinks and retreats once the tray is revealed */
.head{
  padding-left:var(--margin);font-style:italic;font-weight:500;color:var(--plum);
  font-size:clamp(30px,5.4vw,74px);line-height:1.06;letter-spacing:-.005em;
  transition:font-size 900ms cubic-bezier(.22,1,.36,1),
             transform 900ms cubic-bezier(.22,1,.36,1),
             opacity 700ms ease;
  transform:translateY(14vh);
}
body.open .head{font-size:clamp(19px,2.5vw,38px);transform:translateY(0)}

.stagewrap{display:grid;place-items:center;min-height:0;overflow:hidden}
.stage{
  position:relative;aspect-ratio:2451/1540;isolation:isolate;
  /* bleed off the sides, but never taller than the space actually available --
     sizing by width alone pushes the oval off-screen and scrambles the layout */
  width:min(var(--bleed), calc((100dvh - var(--chrome)) * 1.5916));
  transform:scale(.985);
  transition:transform 1200ms cubic-bezier(.22,1,.36,1);
}
body.open .stage{transform:scale(1)}
/* portrait has height to spare and not enough width -- let it crop the rim */
@media (max-aspect-ratio:1/1){ :root{--bleed:146%} }

.scene{position:absolute;inset:0;opacity:0;transform:scale(.972);
  transition:opacity 900ms ease 180ms,transform 1200ms cubic-bezier(.22,1,.36,1) 180ms}
body.open .scene{opacity:1;transform:scale(1)}
.tray{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}

/* ---------- objects ---------- */
.obj{position:absolute;translate:-50% -50%;display:block;text-decoration:none;
  filter:drop-shadow(6px 11px 13px rgba(38,23,13,.42)) drop-shadow(18px 30px 34px rgba(38,23,13,.26));
  transition:filter 460ms ease}
.obj img{width:100%;display:block;transition:transform 520ms cubic-bezier(.33,1,.68,1)}
.obj .drift{display:block;animation:float var(--dur) ease-in-out infinite var(--del)}
@keyframes float{0%,100%{transform:translate3d(0,0,0)}50%{transform:translate3d(var(--dx),var(--dy),0)}}
.obj:hover,.obj:focus-visible{
  filter:drop-shadow(7px 13px 15px rgba(38,23,13,.46)) drop-shadow(21px 35px 40px rgba(38,23,13,.30))}
.obj:hover img,.obj:focus-visible img{transform:scale(1.008)}
.obj:hover .drift,.obj:focus-visible .drift{animation-play-state:paused}
.obj:focus-visible{outline:2px solid var(--plum);outline-offset:12px}

/* the coupe fills with champagne on hover */
.obj .full{position:absolute;inset:0;width:100%;opacity:0;transition:opacity 700ms ease}
.obj:hover .full,.obj:focus-visible .full{opacity:1}
.bubbles{position:absolute;left:50%;top:30%;translate:-50% -50%;
  width:88%;aspect-ratio:1/.56;border-radius:50%;overflow:hidden;
  opacity:0;transition:opacity 600ms ease;pointer-events:none}
.obj:hover .bubbles,.obj:focus-visible .bubbles{opacity:1}
.bubbles i{position:absolute;bottom:6%;border-radius:50%;
  background:radial-gradient(circle at 34% 30%,#fff,rgba(255,248,222,.85) 55%,rgba(255,248,222,.35));
  animation:rise var(--br) linear infinite var(--bd)}
@keyframes rise{
  0%{transform:translateY(0) scale(.6);opacity:0}
  14%{opacity:1}
  78%{opacity:1}
  100%{transform:translateY(-150%) scale(1.15);opacity:0}
}

.chip{position:absolute;left:50%;bottom:calc(100% + 6px);translate:-50% 8px;
  background:var(--plum);color:var(--cream);font-style:italic;
  font-size:clamp(11px,1.05vw,16px);padding:.34em .8em;border-radius:2px;
  white-space:nowrap;text-align:center;opacity:0;pointer-events:none;
  transition:opacity 240ms ease,translate 320ms cubic-bezier(.22,1,.36,1)}
.chip .path{display:block;font-family:"Jost",system-ui,sans-serif;font-style:normal;
  font-size:.66em;letter-spacing:.06em;margin-top:.12em;
  color:color-mix(in srgb,var(--gold) 90%,white)}
.obj:hover .chip,.obj:focus-visible .chip{opacity:1;translate:-50% 0}

/* ---------- cloche ---------- */
.cover{position:absolute;inset:0;display:grid;place-items:center;z-index:5}
.cloche{width:64%;cursor:pointer;transform-origin:50% 92%;
  filter:drop-shadow(0 26px 34px rgba(44,26,14,.16));
  transition:transform var(--lift) cubic-bezier(.32,.9,.28,1),
             opacity calc(var(--lift)*.62) ease calc(var(--lift)*.38)}
body.open .cloche{transform:translateY(-128%) scale(1.1);opacity:0}
body.open .cover{pointer-events:none}

/* ---------- footer ---------- */
.foot{padding-left:var(--margin);display:flex;align-items:baseline;gap:1.4em;
  opacity:0;transition:opacity 800ms ease 500ms}
body.open .foot{opacity:1}
.foot a{font-style:italic;font-size:clamp(17px,1.9vw,30px);color:var(--gold);text-decoration:none}
.foot a:hover{color:var(--red)}
.foot .hint{font-family:"Jost",system-ui,sans-serif;font-size:11px;letter-spacing:.1em;
  color:color-mix(in srgb,var(--brown) 45%,transparent)}
@media (hover:none){
  .chip{opacity:1;translate:-50% 0;font-size:10px}
  .chip .path{display:none}
  .foot .hint{display:none}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition-duration:1ms!important}
}

/* display type matches the portfolio: Bodoni Moda */
h1,h2,h3,.hero h1,.title h1,.headline,.face.said p,.note .place,.intro h2,.course h2,.card h3{font-family:"Bodoni Moda",serif}

@media (max-width:820px){
  .logo,.tray,.coupe,.note,.drift,.obj .drift{animation:none!important}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

<script>
const b=document.body;
let t=setTimeout(()=>b.classList.add('open'), 800);
const open_=()=>{clearTimeout(t); b.classList.add('open')};
document.getElementById('cloche').addEventListener('click',open_);
addEventListener('wheel',open_,{once:true,passive:true});
addEventListener('touchmove',open_,{once:true,passive:true});


// champagne bubbles for the coupe
const bub=document.getElementById('bub');
for(let i=0;i<26;i++){
  const s=document.createElement('i');
  const sz=2+Math.random()*4;
  s.style.width=s.style.height=sz+'px';
  s.style.left=(8+Math.random()*84)+'%';
  s.style.setProperty('--br',(1.6+Math.random()*2.2)+'s');
  s.style.setProperty('--bd',(-Math.random()*3)+'s');
  bub.appendChild(s);
}

document.querySelectorAll('.obj[data-soon]').forEach(function(a){a.addEventListener('click',function(e){e.preventDefault();});});
</script>
