<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inquire — EatUrMood</title>
<meta name="description" content="A few quick questions to find the right creative service: styling or branding. EatUrMood, Santa Barbara.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;1,6..96,400&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{--cream:#F5EFE0;--brown:#2C1A0E;--plum:#3D1A2C;--gold:#C4974A;--line:rgba(44,26,14,.16)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--cream);color:var(--brown)}
body{font-family:'Jost',system-ui,sans-serif;font-weight:300;min-height:100svh;display:flex;flex-direction:column}
a{color:inherit}
.top{display:flex;justify-content:space-between;align-items:center;padding:22px 24px}
.back{font-size:12px;letter-spacing:.16em;text-transform:uppercase;text-decoration:none;opacity:.6}
.back:hover{opacity:1}
.bar{width:120px;height:2px;background:var(--line);position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;width:0;background:var(--plum);transition:width .6s cubic-bezier(.2,.7,.3,1)}

main{flex:1;display:flex;align-items:center;justify-content:center;padding:10px 20px 60px}
.stage{width:min(620px,100%)}
.step{display:none}
.step.on{display:block;animation:in .55s cubic-bezier(.2,.7,.3,1)}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

.kick{font-family:'Bodoni Moda',serif;font-style:italic;font-size:16px;margin:0 0 10px;color:rgba(44,26,14,.6)}
h1,h2{font-family:'Bodoni Moda',serif;font-weight:400;line-height:1.05;margin:0 0 30px;color:var(--plum)}
h1{font-size:clamp(40px,8vw,70px)}
h2{font-size:clamp(32px,6vw,52px)}
.lede{font-size:17px;line-height:1.6;max-width:44ch;margin:-14px 0 30px;color:rgba(44,26,14,.75)}

.opts{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.opts button{width:100%;display:flex;justify-content:space-between;align-items:baseline;gap:16px;text-align:left;
 background:none;border:0;border-bottom:1px solid var(--line);padding:20px 4px;cursor:pointer;color:var(--brown);
 font-family:'Bodoni Moda',serif;font-size:clamp(21px,3.4vw,28px);transition:color .3s,padding .4s cubic-bezier(.2,.7,.3,1)}
.opts button small{font-family:'Jost';font-weight:300;font-size:14px;color:rgba(44,26,14,.55);text-align:right;max-width:24ch}
.opts button:hover,.opts button:focus-visible{color:var(--plum);padding-left:14px;outline:none}
.opts button:focus-visible{box-shadow:inset 3px 0 0 var(--plum)}

.prev{margin:26px 0 0;background:none;border:0;padding:0;cursor:pointer;font-family:'Jost';font-size:13px;
 letter-spacing:.14em;text-transform:uppercase;color:rgba(44,26,14,.55)}
.prev:hover{color:var(--brown)}

/* summary + form */
.picked{margin:0 0 28px;padding:18px 20px;background:rgba(61,26,44,.06);border-left:2px solid var(--plum)}
.picked p{margin:0;font-family:'Bodoni Moda',serif;font-size:19px;line-height:1.5}
.picked span{display:block;font-family:'Jost';font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:rgba(44,26,14,.55);margin:0 0 6px}
form{display:grid;grid-template-columns:1fr 1fr;gap:18px 18px}
label{display:flex;flex-direction:column;gap:7px;font-size:13px;letter-spacing:.08em;color:rgba(44,26,14,.7)}
label.full{grid-column:1/-1}
input,select,textarea{font:inherit;font-size:16px;color:var(--brown);background:transparent;border:0;border-bottom:1px solid rgba(44,26,14,.35);
 padding:9px 2px;border-radius:0;letter-spacing:0}
textarea{min-height:92px;resize:vertical;border:1px solid rgba(44,26,14,.25);padding:10px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--plum)}
.send{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:18px;margin-top:8px}
.send button{background:var(--plum);color:var(--cream);border:0;padding:16px 28px;cursor:pointer;
 font-family:'Jost';font-size:13px;letter-spacing:.18em;text-transform:uppercase;transition:background .3s}
.send button:hover,.send button:focus-visible{background:var(--brown);outline:none}
.send button[disabled]{opacity:.6;cursor:wait}
.send a{font-size:14px;color:rgba(44,26,14,.65);text-underline-offset:4px}
.err{grid-column:1/-1;color:#B83226;font-size:14px;margin:0;min-height:1em}

.done p{font-family:'Bodoni Moda',serif;font-size:20px;line-height:1.55;max-width:40ch}
footer{text-align:center;font-size:12px;letter-spacing:.12em;color:rgba(44,26,14,.5);padding:0 20px 26px}

@media(max-width:560px){
 form{grid-template-columns:1fr}
 .opts button{flex-direction:column;gap:4px}
 .opts button small{text-align:left}
}
@media(prefers-reduced-motion:reduce){.step.on{animation:none}.opts button,.bar i{transition:none}}
</style>
</head>
<body>

<header class="top">
  <a class="back" href="/index.html">&larr; The tray</a>
  <div class="bar" aria-hidden="true"><i id="bar"></i></div>
</header>

<main>
  <div class="stage" id="stage" aria-live="polite"></div>
</main>

<footer>Sallie Townsend · Santa Barbara · hello@eaturmood.com</footer>

<script>
/* ============ EDIT THE QUESTIONS HERE ============ */
const FORMSPREE = 'https://formspree.io/f/mzdnowea';

const Q = {
  start: { kick:'Creative services', title:'Why are you here?', h:'h1',
    lede:'A few quick questions, then you can tell me about the project.',
    opts:[
      {t:'Styling',  s:'Rooms, tables, wardrobes', go:'styling'},
      {t:'Branding', s:'Social, logo, editing',    go:'branding'} ]},

  /* ---- styling path ---- */
  styling: { title:'What are we styling?', opts:[
      {t:'Interior styling', go:'interior'},
      {t:'The dinner table', go:'table'},
      {t:'Wardrobe',         go:'wardrobe'} ]},
  interior: { title:'Whose space is it?', opts:[
      {t:'My home', go:'capture'},
      {t:"A client's project", s:"I'm a designer or firm", go:'capture'},
      {t:'A hotel, restaurant or shop', go:'capture'},
      {t:'A set for a shoot', go:'capture'} ]},
  table: { title:"What's the occasion?", opts:[
      {t:'A dinner party at home', go:'capture'},
      {t:'A wedding or celebration', go:'capture'},
      {t:'A brand event or launch', go:'capture'},
      {t:'A shoot', go:'capture'} ]},
  wardrobe: { title:"What's it for?", opts:[
      {t:'A closet edit', s:'Keep, cut, restyle', go:'capture'},
      {t:'A special event', go:'capture'},
      {t:'A personal shoot', go:'capture'} ]},
  capture: { title:'Should I capture it?', opts:[
      {t:'Yes, photos and short film', go:'when'},
      {t:'Just photos', go:'when'},
      {t:'No, just the styling', go:'when'} ]},

  /* ---- branding path ---- */
  branding: { title:'What do you need?', opts:[
      {t:'Social media', go:'social'},
      {t:'A logo',       go:'logo'},
      {t:'Editing',      go:'editing'},
      {t:'All of the above', go:'all'} ]},
  social: { title:'Where are you now?', opts:[
      {t:'Starting from zero', go:'when'},
      {t:"Posting, but it isn't landing", go:'when'},
      {t:'I need a monthly content partner', go:'when'} ]},
  logo: { title:'Where is the brand?', opts:[
      {t:'Brand new', go:'when'},
      {t:'Needs a refresh', go:'when'},
      {t:'I want the full identity', s:'Logo, colour, type', go:'when'} ]},
  editing: { title:'What are we editing?', opts:[
      {t:'Photos', go:'when'},
      {t:'Short-form video', go:'when'},
      {t:'A brand film', go:'when'} ]},
  all: { title:'Where is the brand?', opts:[
      {t:'Launching something new', go:'when'},
      {t:'Established, needs a new look', go:'when'},
      {t:'A full relaunch', go:'when'} ]},

  /* ---- shared ending ---- */
  when: { title:'When do you need it?', opts:[
      {t:'Within two weeks', go:'form'},
      {t:'This month or next', go:'form'},
      {t:'A few months out', go:'form'},
      {t:'Ongoing', s:'I need someone regularly', go:'form'} ]}
};
/* ================================================= */

const stage = document.getElementById('stage');
const bar = document.getElementById('bar');
let trail = [];              // [{id, answer}]
const LEN = {styling:5, branding:4};

function esc(x){ return x.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function progress(n){
  const path = trail[0] ? (trail[0].answer === 'Styling' ? 'styling' : 'branding') : null;
  const total = path ? LEN[path] + 1 : 6;
  bar.style.width = Math.min(100, n / total * 100) + '%';
}

function show(id){
  if (id === 'form') return showForm();
  const q = Q[id], H = q.h || 'h2';
  stage.innerHTML = `<section class="step on">
    ${q.kick ? `<p class="kick">${q.kick}</p>` : ''}
    <${H}>${esc(q.title)}</${H}>
    ${q.lede ? `<p class="lede">${q.lede}</p>` : ''}
    <ul class="opts">${q.opts.map((o,i)=>`<li><button data-i="${i}">${esc(o.t)}${o.s?`<small>${esc(o.s)}</small>`:''}</button></li>`).join('')}</ul>
    ${trail.length ? '<button class="prev" id="prev">&larr; Back</button>' : ''}
  </section>`;
  stage.querySelectorAll('.opts button').forEach(b => b.addEventListener('click', () => {
    const o = q.opts[b.dataset.i];
    trail.push({id, q:q.title, answer:o.t});
    show(o.go);
  }));
  const p = document.getElementById('prev'); if (p) p.addEventListener('click', back);
  progress(trail.length);
  const first = stage.querySelector('.opts button'); if (first && trail.length) first.focus({preventScroll:true});
}

function back(){ const last = trail.pop(); if (last) show(last.id); }

function summary(){ return trail.slice(1, -1).map(t => t.answer).join(' · '); }

function showForm(){
  const path = trail[0].answer, when = trail[trail.length-1].answer;
  stage.innerHTML = `<section class="step on">
    <p class="kick">Nearly there</p>
    <h2>Tell me about it.</h2>
    <div class="picked"><span>${esc(path)}</span><p>${esc(summary())}<br>${esc(when)}</p></div>
    <form id="f" novalidate>
      <label>Name<input name="name" autocomplete="name" required></label>
      <label>Email<input name="email" type="email" autocomplete="email" required></label>
      <label>Brand, studio or project<input name="brand"></label>
      <label>Location<input name="location" placeholder="City"></label>
      <label class="full">Budget
        <select name="budget"><option value="">Select one</option><option>Under $1,000</option><option>$1,000 – $2,500</option>
        <option>$2,500 – $5,000</option><option>$5,000 – $10,000</option><option>$10,000+</option><option>Not sure yet</option></select></label>
      <label class="full">Anything else<textarea name="message" placeholder="Links, inspiration, dates, the feeling you're after."></textarea></label>
      <p class="err" id="err" role="alert"></p>
      <div class="send"><button type="submit" id="go">Send to Sallie</button><a id="mail" href="#">Or email me directly</a></div>
    </form>
    <button class="prev" id="prev">&larr; Back</button>
  </section>`;
  progress(trail.length);
  document.getElementById('prev').addEventListener('click', back);
  const f = document.getElementById('f');
  const answers = trail.map(t => `${t.q} ${t.answer}`).join('\n');
  const subj = `${path} inquiry: ${summary()}`;
  document.getElementById('mail').href = `mailto:hello@eaturmood.com?subject=${encodeURIComponent(subj)}&body=${encodeURIComponent(answers + '\n\n')}`;
  f.querySelector('input').focus({preventScroll:true});

  f.addEventListener('submit', async e => {
    e.preventDefault();
    const err = document.getElementById('err'), go = document.getElementById('go');
    if (!f.name.value.trim() || !/^\S+@\S+\.\S+$/.test(f.email.value)) { err.textContent = 'Please add your name and a valid email.'; return; }
    err.textContent = ''; go.disabled = true; go.textContent = 'Sending…';
    const data = Object.fromEntries(new FormData(f));
    Object.assign(data, {service: path, selections: summary(), timing: when, answers, _subject: subj, _replyto: data.email});
    try {
      const r = await fetch(FORMSPREE, {method:'POST', headers:{'Accept':'application/json','Content-Type':'application/json'}, body: JSON.stringify(data)});
      if (!r.ok) throw 0;
      bar.style.width = '100%';
      stage.innerHTML = `<section class="step on done"><p class="kick">Received</p><h2>Got it, ${esc(data.name.split(' ')[0])}.</h2>
        <p>Your answers are on their way to hello@eaturmood.com. I'll come back to you within two business days.</p>
        <p><a class="back" href="/index.html">&larr; Back to the tray</a></p></section>`;
    } catch(_) {
      go.disabled = false; go.textContent = 'Send to Sallie';
      err.innerHTML = 'That didn\'t send. Try again, or <a href="' + document.getElementById('mail').href + '">email me directly</a>.';
    }
  });
}

show('start');
</script>
</body>
</html>
